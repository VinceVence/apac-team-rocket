name: Source checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history (redacted)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 0 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts='--all' --redact=100 --no-banner
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MINTTOWN_LIVE: "0"
      MINTTOWN_FRAUD_LIVE: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.9.16"
      - run: uv sync --locked
      - run: uv run --locked python -B -m unittest discover -s web -p 'test_*.py'
      - run: node --test web/test_*.mjs
      - run: uv run --locked python -B web/evaluate_harness.py
      - run: uv run --locked python -B web/evaluate_cases.py --mode fake
