steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/minttown/minttown:${_TAG}', '.']
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/minttown/minttown:${_TAG}'
timeout: 600s
options:
  machineType: E2_MEDIUM
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _TAG: demo
